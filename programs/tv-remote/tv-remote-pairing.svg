<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="ربط TV Remote بمسح رمز QR من شاشة التلفزيون ثم إدخال رمز PIN">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="br3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
  </defs>

  <rect width="900" height="640" fill="url(#bg3)"/>
  <circle cx="760" cy="90" r="220" fill="#7c3aed" opacity=".22"/>
  <circle cx="120" cy="580" r="200" fill="#2563eb" opacity=".18"/>

  <!-- TV -->
  <rect x="48" y="96" width="536" height="336" rx="18" fill="#0f172a" stroke="#3b4a63" stroke-width="3"/>
  <rect x="64" y="112" width="504" height="304" rx="10" fill="#0b1220"/>
  <text x="316" y="150" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">امسح الرمز للربط</text>
  <text x="316" y="174" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c8ca0">TV Remote · رمز صالح 5 دقائق</text>

  <!-- QR -->
  <g transform="translate(236 194)">
    <rect x="-14" y="-14" width="174" height="174" rx="12" fill="#ffffff"/>
    <g fill="#0b1220">
      <rect x="0" y="0" width="42" height="42" rx="4"/>
      <rect x="8" y="8" width="26" height="26" rx="3" fill="#ffffff"/>
      <rect x="14" y="14" width="14" height="14" rx="2"/>
      <rect x="104" y="0" width="42" height="42" rx="4"/>
      <rect x="112" y="8" width="26" height="26" rx="3" fill="#ffffff"/>
      <rect x="118" y="14" width="14" height="14" rx="2"/>
      <rect x="0" y="104" width="42" height="42" rx="4"/>
      <rect x="8" y="112" width="26" height="26" rx="3" fill="#ffffff"/>
      <rect x="14" y="118" width="14" height="14" rx="2"/>
      <g>
        <rect x="56" y="4" width="8" height="8"/><rect x="72" y="0" width="8" height="8"/><rect x="88" y="8" width="8" height="8"/>
        <rect x="56" y="20" width="8" height="8"/><rect x="80" y="24" width="8" height="8"/>
        <rect x="48" y="40" width="8" height="8"/><rect x="64" y="48" width="8" height="8"/><rect x="88" y="44" width="8" height="8"/>
        <rect x="108" y="56" width="8" height="8"/><rect x="124" y="64" width="8" height="8"/><rect x="140" y="56" width="8" height="8"/>
        <rect x="4" y="56" width="8" height="8"/><rect x="24" y="64" width="8" height="8"/><rect x="40" y="56" width="8" height="8"/>
        <rect x="8" y="76" width="8" height="8"/><rect x="32" y="80" width="8" height="8"/>
        <rect x="56" y="64" width="8" height="8"/><rect x="72" y="72" width="8" height="8"/><rect x="88" y="64" width="8" height="8"/>
        <rect x="56" y="88" width="8" height="8"/><rect x="80" y="92" width="8" height="8"/><rect x="100" y="84" width="8" height="8"/>
        <rect x="64" y="108" width="8" height="8"/><rect x="88" y="112" width="8" height="8"/><rect x="112" y="104" width="8" height="8"/>
        <rect x="128" y="120" width="8" height="8"/><rect x="140" y="136" width="8" height="8"/>
        <rect x="60" y="128" width="8" height="8"/><rect x="84" y="136" width="8" height="8"/><rect x="108" y="128" width="8" height="8"/>
        <rect x="8" y="136" width="8" height="8"/><rect x="28" y="128" width="8" height="8"/>
      </g>
    </g>
  </g>

  <!-- TV stand -->
  <rect x="272" y="432" width="88" height="14" rx="7" fill="#1e293b"/>
  <rect x="222" y="446" width="188" height="9" rx="4.5" fill="#0f172a"/>

  <!-- phone scanning -->
  <g transform="rotate(6 720 350)">
    <rect x="612" y="176" width="196" height="356" rx="30" fill="url(#ph3)" stroke="#3f4f6b" stroke-width="3"/>
    <rect x="622" y="186" width="176" height="336" rx="24" fill="#0b1220"/>
    <rect x="672" y="196" width="76" height="12" rx="6" fill="#0f172a"/>
    <rect x="636" y="222" width="148" height="196" rx="14" fill="#111c30"/>
    <!-- camera frame corners -->
    <g stroke="#60a5fa" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M660 250v-14h14"/>
      <path d="M746 236h14v14"/>
      <path d="M660 376v14h14"/>
      <path d="M760 390h-14v-14"/>
    </g>
    <rect x="682" y="288" width="56" height="56" rx="6" fill="#ffffff" opacity=".9"/>
    <rect x="694" y="300" width="32" height="32" rx="4" fill="#0b1220"/>
    <text x="710" y="448" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94a3b8">وجّه الكاميرا نحو الرمز</text>
    <rect x="668" y="470" width="84" height="24" rx="12" fill="url(#br3)"/>
    <text x="710" y="487" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#ffffff">مسح QR</text>
  </g>

  <!-- PIN badge -->
  <g>
    <rect x="48" y="486" width="330" height="70" rx="16" fill="#0f172a" stroke="#334155"/>
    <rect x="68" y="504" width="34" height="34" rx="10" fill="url(#br3)"/>
    <text x="85" y="528" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="17" font-weight="700" fill="#ffffff">#</text>
    <text x="118" y="516" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">رمز PIN لمرة واحدة</text>
    <text x="118" y="536" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c8ca0">يظهر على شاشة التلفزيون عند أول اتصال</text>
  </g>

  <text x="48" y="602" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" fill="#94a3b8">كل الأجهزة على نفس شبكة Wi-Fi — بدون حساب وبدون سيرفر خارجي</text>
</svg>
