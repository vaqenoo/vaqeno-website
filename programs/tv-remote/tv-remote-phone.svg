<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" width="720" height="1080" role="img" aria-label="تطبيق TV Remote على الجوال — بث شاشة التلفزيون ولوحة اللمس وأزرار الريموت">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="br2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="scr2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1080" fill="url(#bg2)"/>
  <circle cx="620" cy="120" r="180" fill="#7c3aed" opacity=".10"/>
  <circle cx="90" cy="940" r="200" fill="#2563eb" opacity=".10"/>

  <!-- phone -->
  <rect x="168" y="70" width="384" height="940" rx="52" fill="url(#ph2)"/>
  <rect x="180" y="82" width="360" height="916" rx="44" fill="#0b1220"/>
  <rect x="306" y="96" width="108" height="18" rx="9" fill="#0f172a"/>

  <!-- header -->
  <text x="212" y="158" font-family="Segoe UI, Tahoma, sans-serif" font-size="19" font-weight="700" fill="#e2e8f0">TV Remote</text>
  <circle cx="500" cy="152" r="6" fill="#34d399"/>
  <text x="490" y="158" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#94a3b8">غرفة الجلوس</text>

  <!-- live screen -->
  <rect x="204" y="182" width="312" height="176" rx="14" fill="url(#scr2)"/>
  <g transform="translate(360 266)" opacity=".95">
    <circle r="34" fill="#ffffff" opacity=".18"/>
    <path d="M-10 -17 L22 0 L-10 17 Z" fill="#ffffff"/>
  </g>
  <rect x="222" y="322" width="120" height="9" rx="4.5" fill="#ffffff" opacity=".8"/>
  <rect x="222" y="338" width="72" height="7" rx="3.5" fill="#ffffff" opacity=".45"/>
  <rect x="222" y="192" width="56" height="18" rx="9" fill="#0b1220" opacity=".55"/>
  <circle cx="234" cy="201" r="4" fill="#f87171"/>
  <text x="244" y="205" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#ffffff">مباشر</text>

  <!-- touchpad -->
  <circle cx="360" cy="452" r="86" fill="#101a30" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="360" cy="452" r="62" fill="#1e293b" opacity=".65"/>
  <circle cx="360" cy="452" r="18" fill="url(#br2)"/>
  <path d="M360 372v-14M360 532v14M280 452h-14M440 452h14" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- buttons row -->
  <g>
    <rect x="204" y="566" width="94" height="62" rx="14" fill="#1e293b"/>
    <rect x="313" y="566" width="94" height="62" rx="14" fill="#1e293b"/>
    <rect x="422" y="566" width="94" height="62" rx="14" fill="#1e293b"/>
    <path d="M243 603h20l-10-12z" fill="#93c5fd"/>
    <circle cx="360" cy="597" r="12" fill="none" stroke="#93c5fd" stroke-width="3"/>
    <rect x="455" y="590" width="22" height="18" rx="4" fill="#93c5fd"/>
    <text x="251" y="620" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">رجوع</text>
    <text x="360" y="620" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">الرئيسية</text>
    <text x="469" y="620" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">الأخيرة</text>
  </g>

  <!-- volume -->
  <g>
    <rect x="204" y="652" width="312" height="52" rx="14" fill="#111c30"/>
    <path d="M226 678h12l8-8v16l-8-8h-12z" fill="#93c5fd"/>
    <rect x="256" y="673" width="190" height="10" rx="5" fill="#1e293b"/>
    <rect x="256" y="673" width="132" height="10" rx="5" fill="url(#br2)"/>
    <circle cx="388" cy="678" r="10" fill="#e2e8f0"/>
    <text x="500" y="682" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="11" fill="#64748b">الصوت</text>
  </g>

  <!-- apps -->
  <text x="204" y="742" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">تطبيقات التلفزيون</text>
  <g>
    <rect x="204" y="758" width="64" height="64" rx="14" fill="#1d4ed8"/>
    <rect x="286" y="758" width="64" height="64" rx="14" fill="#0f766e"/>
    <rect x="368" y="758" width="64" height="64" rx="14" fill="#7c3aed"/>
    <rect x="450" y="758" width="64" height="64" rx="14" fill="#334155"/>
    <circle cx="236" cy="790" r="13" fill="#ffffff" opacity=".85"/>
    <rect x="312" y="780" width="12" height="20" rx="3" fill="#ffffff" opacity=".85"/>
    <path d="M392 780l18 20h-36z" fill="#ffffff" opacity=".85"/>
    <rect x="472" y="782" width="20" height="16" rx="3" fill="#ffffff" opacity=".5"/>
  </g>

  <!-- keyboard -->
  <g>
    <rect x="204" y="846" width="312" height="44" rx="12" fill="#111c30" stroke="#334155"/>
    <text x="222" y="873" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#64748b">اكتب نصاً ليظهر على التلفزيون…</text>
    <rect x="462" y="858" width="38" height="20" rx="6" fill="url(#br2)"/>
  </g>
  <rect x="312" y="930" width="96" height="6" rx="3" fill="#334155"/>

  <!-- labels -->
  <g>
    <rect x="42" y="330" width="112" height="48" rx="12" fill="#ffffff" opacity=".96"/>
    <text x="98" y="352" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e293b">بث الشاشة</text>
    <text x="98" y="368" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">مباشر وحي</text>

    <rect x="574" y="430" width="112" height="48" rx="12" fill="#ffffff" opacity=".96"/>
    <text x="630" y="452" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e293b">لوحة لمس</text>
    <text x="630" y="468" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">نقر وسحب</text>

    <rect x="42" y="700" width="112" height="48" rx="12" fill="#ffffff" opacity=".96"/>
    <text x="98" y="722" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" font-weight="700" fill="#1e293b">ريموت كامل</text>
    <text x="98" y="738" text-anchor="middle" font-family="Segoe UI, Tahoma, sans-serif" font-size="10" fill="#64748b">وصوت وتطبيقات</text>
  </g>
</svg>
