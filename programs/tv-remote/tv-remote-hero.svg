<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="TV Remote — تحكم في تلفزيون Android TV من الجوال والكمبيوتر مع بث الشاشة">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset=".55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#221c4d"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213c"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <circle cx="980" cy="130" r="320" fill="url(#glow)"/>
  <circle cx="160" cy="680" r="280" fill="url(#glow)" opacity=".75"/>
  <g stroke="#ffffff" stroke-opacity=".045" stroke-width="1">
    <path d="M0 190h1200M0 380h1200M0 570h1200"/>
    <path d="M200 0v760M420 0v760M640 0v760M860 0v760M1080 0v760"/>
  </g>

  <!-- TV -->
  <g>
    <rect x="70" y="112" width="726" height="428" rx="20" fill="#0f172a" stroke="#3b4a63" stroke-width="3"/>
    <rect x="88" y="130" width="690" height="392" rx="12" fill="url(#screen)"/>

    <!-- screen top bar -->
    <g opacity=".9">
      <circle cx="116" cy="158" r="6" fill="#f87171"/>
      <circle cx="138" cy="158" r="6" fill="#fbbf24"/>
      <circle cx="160" cy="158" r="6" fill="#34d399"/>
      <text x="700" y="164" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="15" fill="#93a4bd">البث المباشر</text>
      <circle cx="742" cy="158" r="5" fill="#34d399"/>
    </g>

    <!-- big hero tile -->
    <rect x="112" y="186" width="420" height="196" rx="14" fill="url(#tile1)" opacity=".92"/>
    <rect x="112" y="186" width="420" height="196" rx="14" fill="url(#screen)" opacity=".28"/>
    <g transform="translate(320 258)" opacity=".95">
      <circle r="40" fill="#ffffff" opacity=".16"/>
      <path d="M-12 -20 L26 0 L-12 20 Z" fill="#ffffff" opacity=".95"/>
    </g>
    <rect x="138" y="318" width="196" height="12" rx="6" fill="#ffffff" opacity=".85"/>
    <rect x="138" y="342" width="128" height="9" rx="4.5" fill="#ffffff" opacity=".45"/>

    <!-- side column -->
    <rect x="552" y="186" width="200" height="92" rx="12" fill="url(#tile2)" opacity=".85"/>
    <rect x="552" y="290" width="200" height="92" rx="12" fill="#334155"/>
    <rect x="572" y="210" width="96" height="10" rx="5" fill="#ffffff" opacity=".8"/>
    <rect x="572" y="232" width="140" height="8" rx="4" fill="#ffffff" opacity=".4"/>
    <rect x="572" y="314" width="110" height="10" rx="5" fill="#ffffff" opacity=".65"/>
    <rect x="572" y="336" width="70" height="8" rx="4" fill="#ffffff" opacity=".35"/>

    <!-- app row -->
    <g>
      <rect x="112" y="404" width="86" height="86" rx="14" fill="#1d4ed8" opacity=".9"/>
      <rect x="214" y="404" width="86" height="86" rx="14" fill="#0f766e" opacity=".9"/>
      <rect x="316" y="404" width="86" height="86" rx="14" fill="#7c3aed" opacity=".9"/>
      <rect x="418" y="404" width="86" height="86" rx="14" fill="#334155"/>
      <rect x="520" y="404" width="86" height="86" rx="14" fill="#475569"/>
      <rect x="622" y="404" width="86" height="86" rx="14" fill="#1e293b" stroke="#475569"/>
      <rect x="632" y="452" width="66" height="8" rx="4" fill="#64748b"/>
      <rect x="642" y="438" width="46" height="6" rx="3" fill="#475569"/>
    </g>

    <!-- TV stand -->
    <rect x="378" y="540" width="110" height="16" rx="8" fill="#1e293b"/>
    <rect x="318" y="556" width="230" height="10" rx="5" fill="#0f172a"/>
  </g>

  <!-- Phone -->
  <g>
    <rect x="818" y="128" width="292" height="572" rx="42" fill="url(#phone)" stroke="#3f4f6b" stroke-width="3"/>
    <rect x="830" y="140" width="268" height="548" rx="34" fill="#0b1220"/>
    <rect x="916" y="152" width="96" height="16" rx="8" fill="#0f172a"/>

    <!-- phone status -->
    <text x="856" y="196" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" fill="#94a3b8">TV Remote</text>
    <circle cx="1058" cy="191" r="5" fill="#34d399"/>

    <!-- mirrored screen -->
    <rect x="850" y="214" width="228" height="128" rx="12" fill="url(#tile1)" opacity=".9"/>
    <g transform="translate(964 278)" opacity=".9">
      <circle r="26" fill="#ffffff" opacity=".18"/>
      <path d="M-8 -13 L17 0 L-8 13 Z" fill="#ffffff"/>
    </g>
    <rect x="866" y="318" width="90" height="8" rx="4" fill="#ffffff" opacity=".75"/>

    <!-- touchpad -->
    <circle cx="964" cy="432" r="62" fill="#101a30" stroke="#2563eb" stroke-width="2"/>
    <circle cx="964" cy="432" r="42" fill="#1e293b" opacity=".7"/>
    <circle cx="964" cy="432" r="13" fill="url(#brand)"/>

    <!-- remote buttons -->
    <g>
      <rect x="852" y="512" width="62" height="46" rx="12" fill="#1e293b"/>
      <rect x="922" y="512" width="62" height="46" rx="12" fill="#1e293b"/>
      <rect x="992" y="512" width="62" height="46" rx="12" fill="#1e293b"/>
      <path d="M876 535h14l-7 -9z" fill="#93c5fd"/>
      <circle cx="953" cy="535" r="9" fill="#93c5fd"/>
      <rect x="1015" y="528" width="16" height="14" rx="3" fill="#93c5fd"/>
    </g>

    <!-- volume -->
    <g>
      <rect x="852" y="578" width="202" height="10" rx="5" fill="#1e293b"/>
      <rect x="852" y="578" width="128" height="10" rx="5" fill="url(#brand)"/>
      <circle cx="980" cy="583" r="11" fill="#e2e8f0"/>
      <text x="1048" y="620" text-anchor="end" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" fill="#64748b">مستوى الصوت</text>
    </g>
    <rect x="884" y="644" width="160" height="8" rx="4" fill="#334155"/>
  </g>

  <!-- floating badges -->
  <g>
    <rect x="52" y="618" width="196" height="62" rx="16" fill="#0f172a" opacity=".92" stroke="#334155"/>
    <circle cx="82" cy="649" r="12" fill="#2563eb"/>
    <path d="M77 643l10 6l-10 6z" fill="#ffffff"/>
    <text x="106" y="646" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" fill="#e2e8f0">بث حي للشاشة</text>
    <text x="106" y="665" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c8ca0">تأخير منخفض</text>
  </g>
  <g>
    <rect x="700" y="56" width="188" height="56" rx="16" fill="#0f172a" opacity=".92" stroke="#334155"/>
    <circle cx="728" cy="84" r="11" fill="#34d399"/>
    <text x="748" y="81" font-family="Segoe UI, Tahoma, sans-serif" font-size="14" fill="#e2e8f0">اتصال مشفّر</text>
    <text x="748" y="99" font-family="Segoe UI, Tahoma, sans-serif" font-size="12" fill="#7c8ca0">QR + PIN</text>
  </g>

  <!-- brand -->
  <g transform="translate(70 704)">
    <rect x="0" y="-16" width="34" height="34" rx="10" fill="url(#brand)"/>
    <path d="M9 -4l8 5l-8 5z" fill="#ffffff" transform="translate(2 3)"/>
    <text x="46" y="8" font-family="Segoe UI, Tahoma, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">VAQENO · TV REMOTE</text>
  </g>
</svg>
