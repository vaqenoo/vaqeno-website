<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - حلول ذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 5px;
        }

        .register-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            direction: rtl;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .success-msg {
            background: #f0fdf4;
            color: #16a34a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .password-hint {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <h1>إنشاء حساب جديد</h1>
            <p>حلول ذكية - برامج لحل مشاكلك</p>
        </div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg">تم إنشاء الحساب بنجاح!</div>

        <form id="registerForm">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="fullname" placeholder="أدخل اسمك الكامل" required autocomplete="name">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="new-password">
                <div class="password-hint">يجب أن تكون 6 أحرف على الأقل</div>
            </div>
            <div class="form-group">
                <label>تأكيد كلمة المرور</label>
                <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required autocomplete="new-password">
            </div>
            <button type="submit" class="register-btn">إنشاء حساب</button>
        </form>

        <div class="login-link">
            لديك حساب بالفعل؟ <a href="login.html">سجل دخولك</a>
        </div>
        <a href="index.html" class="back-link">العودة للموقع</a>
    </div>

    <script>
        async function hashPassword(password) {
            var encoder = new TextEncoder();
            var data = encoder.encode(password);
            var hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var fullname = document.getElementById('fullname').value;
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;

            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';

            if (password.length < 6) {
                document.getElementById('errorMsg').textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                document.getElementById('errorMsg').textContent = 'كلمتا المرور غير متطابقتين';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            var users = JSON.parse(localStorage.getItem('smartSolutionsUsers')) || [];
            var emailExists = users.find(function(u) { return u.email === email; });

            if (emailExists) {
                document.getElementById('errorMsg').textContent = 'البريد الإلكتروني مسجل بالفعل';
                document.getElementById('errorMsg').style.display = 'block';
                return;
            }

            var hashedPassword = await hashPassword(password);
            users.push({ fullname: fullname, email: email, password: hashedPassword });
            localStorage.setItem('smartSolutionsUsers', JSON.stringify(users));

            document.getElementById('successMsg').style.display = 'block';
            setTimeout(function() {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>

    <style>.icount-credit{display:none!important}</style>
    <script src="https://icount.kr/c.js?id=msa884207-spec.github.io"></script>
    <script>
        (function() {
            var siteId = 'msa884207-spec.github.io';
            function fill() {
                var d = window.iCountData && window.iCountData[siteId];
                if (!d) return false;
                var t = document.querySelector('[data-icount="today"]');
                var n = document.querySelector('[data-icount="total"]');
                if (t) t.textContent = d.today.pv.toLocaleString('en-US');
                if (n) n.textContent = d.total.pv.toLocaleString('en-US');
                notify(d.total.pv, d.realtime);
                return true;
            }
            function notify(total, realtime) {
                var key = 'vaqeno_icount_notified';
                var last = parseInt(localStorage.getItem(key) || '0', 10);
                if (total <= last) return;
                localStorage.setItem(key, String(total));
                var text = '👥 زيارة جديدة! إجمالي الزيارات: ' + total + ' · متصل الآن: ' + realtime;
                var xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://api.vaqenoo.com/send');
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.send(JSON.stringify({ chat_id: 8814437947, text: text }));
            }
            if (!fill()) setTimeout(fill, 2000);
        })();
    </script>

    <script>
        (function() {
            function hideCredit() {
                var els = document.querySelectorAll('.icount-credit');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
            if (window.MutationObserver) {
                new MutationObserver(hideCredit).observe(document.documentElement, { childList: true, subtree: true });
            }
            hideCredit();
            for (var t = 1; t <= 6; t++) setTimeout(hideCredit, t * 1000);
        })();
    </script>
</body>
</html>
