<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - حلول ذكية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #fff;
            border-radius: 15px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.8rem;
            color: #0f172a;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #64748b;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #475569;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            direction: rtl;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #fff;
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }

        .success-msg {
            background: #f0fdf4;
            color: #16a34a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>تسجيل الدخول</h1>
            <p>حلول ذكية - برامج لحل مشاكلك</p>
        </div>

        <div class="error-msg" id="errorMsg">البريد الإلكتروني أو كلمة المرور غير صحيحة</div>
        <div class="success-msg" id="successMsg">تم تسجيل الدخول بنجاح!</div>

        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required autocomplete="email">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
        </div>
        <a href="index.html" class="back-link">العودة للموقع</a>
    </div>

    <script>
        async function hashPassword(password) {
            var encoder = new TextEncoder();
            var data = encoder.encode(password);
            var hash = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';

            var hashedPassword = await hashPassword(password);
            var users = JSON.parse(localStorage.getItem('smartSolutionsUsers')) || [];
            var user = users.find(function(u) { return u.email === email && u.password === hashedPassword; });

            if (user) {
                document.getElementById('successMsg').style.display = 'block';
                localStorage.setItem('loggedInUser', JSON.stringify({ fullname: user.fullname, email: user.email }));
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                document.getElementById('errorMsg').textContent = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>

    <style>.icount-credit{display:none!important}</style>
    <script src="https://icount.kr/c.js?id=msa884207-spec.github.io"></script>
    <script>
        (function() {
            var siteId = 'msa884207-spec.github.io';
            function fill() {
                var d = window.iCountData && window.iCountData[siteId];
                if (!d) return false;
                var t = document.querySelector('[data-icount="today"]');
                var n = document.querySelector('[data-icount="total"]');
                if (t) t.textContent = d.today.pv.toLocaleString('en-US');
                if (n) n.textContent = d.total.pv.toLocaleString('en-US');
                return true;
            }
            if (!fill()) setTimeout(fill, 2000);
        })();
    </script>

    <script>
        (function() {
            function hideCredit() {
                var els = document.querySelectorAll('.icount-credit');
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
            if (window.MutationObserver) {
                new MutationObserver(hideCredit).observe(document.documentElement, { childList: true, subtree: true });
            }
            hideCredit();
            for (var t = 1; t <= 6; t++) setTimeout(hideCredit, t * 1000);
        })();
    </script>
</body>
</html>
